<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomb Hunter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #141c28;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 8px;
            font-family: -apple-system, 'Segoe UI', sans-serif;
        }
        canvas#canvas {
            display: block;
            border-radius: 6px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .controls {
            color: #8899aa;
            font-size: 13px;
            text-align: center;
            letter-spacing: 0.3px;
        }
        .controls span { color: #ccd6e0; font-weight: 600; }
        #loading {
            color: #ffcc00;
            font-size: 14px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.4);
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <div class="controls">
        <span>Arrow Keys / WASD</span> &nbsp;Move&nbsp;&nbsp;|&nbsp;&nbsp;
        <span>E</span> &nbsp;Place Bomb&nbsp;&nbsp;|&nbsp;&nbsp;
        <span>Q</span> &nbsp;Detonate
    </div>
    <div id="loading">Loading...</div>
    <script>
        // Auto-focus canvas for keyboard input
        var canvas = document.getElementById('canvas');
        canvas.focus();
        canvas.addEventListener('click', function() { canvas.focus(); });
        // Hide loading message once game starts
        var loading = document.getElementById('loading');
        var check = setInterval(function() {
            if (document.querySelector('canvas') && document.querySelector('canvas').width > 0) {
                setTimeout(function() { loading.style.display = 'none'; }, 1000);
                clearInterval(check);
            }
        }, 200);
    </script>
    {{{ SCRIPT }}}
</body>
</html>
